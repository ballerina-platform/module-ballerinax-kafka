# ballerina:13 flags the Schema Registry property keys "basic.auth.credentials.source" / "basic.auth.user.info".
# These are fixed Confluent client property NAMES, and the value is built from `configurable` values declared with `= ?`.
# ballerina:14 flags `auth` / `password` fields assigned from `configurable` values (kafkaAPISecret, registryAPISecret),
# which the user supplies in Config.toml. No credential is hard coded.
# TODO: replace this rule exclusion with a targeted scan suppression (with a reason) once `bal scan` supports it
# (planned for v0.13.0), and fix the false positives on the scan tool side: a secret-named identifier should only be
# reported when it is assigned a fixed value.
[rule]
exclude = ["ballerina:13", "ballerina:14"]
