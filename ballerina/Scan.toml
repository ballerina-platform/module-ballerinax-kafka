# ballerina:13 flags the public constants AUTH_SASL_PLAIN, AUTH_SASL_SCRAM_SHA_256 and AUTH_SASL_SCRAM_SHA_512. They hold
# the names of the Kafka SASL mechanisms ("PLAIN", "SCRAM-SHA-256", "SCRAM-SHA-512"), which are public protocol identifiers,
# not credentials. They are part of the public API and cannot be renamed.
[rule]
exclude = ["ballerina:13"]
